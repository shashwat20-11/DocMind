
# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/docmind?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# SQL Logging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG



# Google Gemini via Spring AI OpenAI Compatibility Layer
spring.ai.openai.api-key=${GEMINI_API_KEY}
spring.ai.openai.chat.options.model=gemini-flash-lite-latest
spring.ai.openai.chat.options.temperature=0.2

# Disable Spring AI OpenAI embedding auto-configuration
spring.ai.openai.embedding.enabled=false

# App RAG Configurations
app.rag.chunk-size=700
app.rag.chunk-overlap=100
app.rag.top-k=5
app.rag.similarity-threshold=0.0
app.rag.min-chunk-size-chars=350
app.rag.min-chunk-length-to-embed=5
app.rag.max-num-chunks=1000

#Spring AI does not have native vector store auto-configuration for MySQL.Unlike PostgreSQL (pgvector)
# Path where SimpleVectorStore will persist embeddings locally
app.rag.vector-store-path=./vector_store.json


# CORS Configuration
app.cors.allowed-origins=*
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*


# Multipart File Size Limits
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=50MB

